# 冒烟：无偏置分类头 + 后续融合/剪枝/逐层对称 INT8。
# 数据与 exp_baseline 相同（processed_smoke / splits_smoke）。
base: configs/base.yaml
data: configs/data.yaml
model: configs/model_smoke.yaml
train: configs/train.yaml
infer: configs/infer.yaml

overrides:
  base:
    run_name: exp_tianchi_baseline_nobias_symint8
  data:
    max_index_rows: 500
    mcelog_max_rows: 800000
    window_seconds: 300
    label_horizon_seconds: 300
    label_backtrace_seconds: 300
    grid_representation: spatial_heatmap
    inventory_as_grid_channels: true
    index_features_path: data/index_stubs/features_5m_index_demo.csv
    processed_dir: data/processed_smoke
    splits_dir: data/splits_smoke
    split_strategy: time_stratified
    drop_empty_mcelog_windows: true
    normalization_method: robust
    time_split:
      train_ratio: 0.6
      val_ratio: 0.2
      test_ratio: 0.2
      min_pos_per_split: 1
  model:
    head_bias: false
  train:
    epochs: 20
    patience: 6
    imbalance:
      weight_scheme: sqrt
      positive_weight_cap: 30.0
      focal_gamma: 0.0
      positive_oversample_factor: 1
    gpu:
      auto_batch_size: false
    ddp:
      enabled: false
  infer:
    gpu:
      auto_batch_size: false
    ddp:
      enabled: false
