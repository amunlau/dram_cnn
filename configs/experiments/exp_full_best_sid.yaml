# 全量数据 + 按 sid 切分 + 多卡 DDP（跨服务器泛化评估）
# 与 exp_full_best_ddp 共用同一 processed/ 与索引；仅切分策略与 splits 目录不同。
# 前置：已对 exp_full_best_ddp 完成 preprocess（或对本 yaml 全量 preprocess 一次）。
# 仅重切分：bash scripts/resplit.sh configs/experiments/exp_full_best_sid.yaml
base: configs/base.yaml
data: configs/data.yaml
model: configs/model.yaml
train: configs/train.yaml
infer: configs/infer.yaml

overrides:
  base:
    run_name: exp_tianchi_full_best_sid
  data:
    index_features_path: data/raw/features_index_h300s_step300s_full.csv
    max_index_rows: null
    mcelog_max_rows: null
    split_strategy: sid
    splits_dir: data/splits_sid
    drop_empty_mcelog_windows: true
    normalization_method: robust
    mcelog_chunk_rows: 400000
  train:
    imbalance:
      positive_oversample_factor: 2
      weight_scheme: sqrt
      positive_weight_cap: 30.0
      focal_gamma: 0.0
    num_workers: 2
    prefetch_factor: 2
