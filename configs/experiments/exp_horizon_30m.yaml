# 30 分钟预测窗 + 10 分钟采样步长（冒烟）
# 前置：bash scripts/build_horizon_indexes.sh smoke
base: configs/base.yaml
data: configs/data.yaml
model: configs/model.yaml
train: configs/train.yaml
infer: configs/infer.yaml

overrides:
  base:
    run_name: exp_horizon_30m
  data:
    window_seconds: 1800
    label_horizon_seconds: 1800
    label_backtrace_seconds: 1800
    max_index_rows: 500
    mcelog_max_rows: 800000
    index_features_path: data/index_stubs/features_index_h1800s_step600s_smoke.csv
    processed_dir: data/processed_horizon_30m_smoke
    splits_dir: data/splits_horizon_30m_smoke
    drop_empty_mcelog_windows: true
    # 冒烟 mcelog 仅 80 万行，正样本空窗较多；全量实验再开 drop_empty_positive_windows
    drop_empty_positive_windows: false
  train:
    epochs: 20
    patience: 6
    early_stop_metric: avg_precision
    imbalance:
      focal_gamma: 0.0
      weight_scheme: sqrt
      positive_weight_cap: 30.0
      positive_oversample_factor: 1
    threshold_search:
      objective: min_recall
      min_recall: 0.85
      min_precision: 0.45
      min: 0.05
      max: 0.95
      step: 0.02
    gpu:
      auto_batch_size: false
    ddp:
      enabled: false
  infer:
    gpu:
      auto_batch_size: false
    ddp:
      enabled: false
