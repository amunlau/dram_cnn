# 全量 F1 + 无偏置 + 整网全 INT8 交付实验。
# 训练阶段与 exp_full_f1_nobias_ddp 相同（分类头无 bias；复用 processed/splits）。
# 量化阶段默认不保护首尾层（见 scripts/fuse_prune_quantize.sh，不加 --protect-ends）。
# patience 显式 50（不是冒烟的 6）。全量 best_f1 常在第 2～6 轮见顶，训练仍会跑到
# 约 50+ 轮才早停；保存的是历史最优而非最后一轮。见
# delivery/nobias-symint8-20260818/evidence/notes/训练早停与第2轮最优说明.md
base: configs/base.yaml
data: configs/data.yaml
model: configs/model.yaml
train: configs/train.yaml
infer: configs/infer.yaml

overrides:
  base:
    run_name: exp_tianchi_full_f1_nobias_allint8_ddp
  data:
    index_features_path: data/raw/features_index_h300s_step300s_full.csv
    max_index_rows: null
    mcelog_max_rows: null
    split_strategy: time_stratified
    drop_empty_mcelog_windows: true
    drop_empty_positive_windows: false
    normalization_method: robust
    time_split:
      min_pos_per_split: 1
    mcelog_chunk_rows: 400000
    ram_budget_frac: 0.85
    preprocess_workers: 1
  model:
    head_bias: false
  train:
    early_stop_metric: best_f1
    patience: 50  # 全量不得用冒烟的 6；最优轮次早 ≠ 提前停
    epochs: 300
    imbalance:
      positive_oversample_factor: 2
      weight_scheme: sqrt
      positive_weight_cap: 30.0
      focal_gamma: 0.0
    threshold_search:
      objective: f1
      min: 0.1
      max: 0.9
      step: 0.02
    num_workers: 2
    prefetch_factor: 2
