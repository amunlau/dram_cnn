# 全量数据 + 多卡 DDP 训练入口（关闭调试截断，启用高吞吐默认）
base: configs/base.yaml
data: configs/data.yaml
model: configs/model.yaml
train: configs/train.yaml
infer: configs/infer.yaml

overrides:
  base:
    run_name: exp_tianchi_full_best_ddp
  data:
    # 全量：先 bash scripts/build_index.sh full，再将 index_features_path 指向全量 CSV，例如：
    # index_features_path: data/raw/features_index_h300s_step300s_full.csv
    index_features_path: data/raw/features_index_h300s_step300s_full.csv
    max_index_rows: null
    mcelog_max_rows: null
    # 高核数 Linux 服务器：提高预处理 fork 进程预算（112 逻辑核 × 0.85 ≈ 95 worker）
    preprocess_parallel_frac: 0.85
  train:
    # GPU 训练时 DataLoader 预取（dataset 按样本 copy，适合多 worker）
    num_workers: 8
    prefetch_factor: 4
    # gpu / ddp 继承 base.yaml（auto 多卡 + 80% 显存 batch）
