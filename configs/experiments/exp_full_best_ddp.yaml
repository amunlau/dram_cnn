# 全量数据 + 多卡 DDP 训练入口（关闭调试截断，启用高吞吐默认）
base: configs/base.yaml
data: configs/data.yaml
model: configs/model.yaml
train: configs/train.yaml
infer: configs/infer.yaml

overrides:
  base:
    run_name: exp_tianchi_full_best_ddp
  data:
    index_features_path: data/raw/features_index_h300s_step300s_full.csv
    max_index_rows: null
    mcelog_max_rows: null
    split_strategy: time_stratified
    drop_empty_mcelog_windows: true
    normalization_method: robust
    time_split:
      min_pos_per_split: 1
    # 系统内存峰值 ≤50%（继承 data.yaml ram_budget_frac；全量 ~66k 行通常压至 worker=1）
    mcelog_chunk_rows: 400000
  train:
    imbalance:
      positive_oversample_factor: 2
      # GridCNN-Deep（model.yaml）+ focal_gamma>0 在默认 lr 下易第 2 步梯度 NaN；与 exp_baseline 对齐更稳
      weight_scheme: sqrt
      positive_weight_cap: 30.0
      focal_gamma: 0.0
    num_workers: 2
    prefetch_factor: 2
    # gpu / ddp 继承 base.yaml（auto 多卡 + 80% 显存 batch）
