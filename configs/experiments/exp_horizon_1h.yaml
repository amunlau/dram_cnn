# 1 小时预测窗 + 30 分钟采样步长
# 前置：bash scripts/build_horizon_indexes.sh smoke（生成下方 stub 索引）
base: configs/base.yaml
data: configs/data.yaml
model: configs/model.yaml
train: configs/train.yaml
infer: configs/infer.yaml

overrides:
  base:
    run_name: exp_horizon_1h
  data:
    window_seconds: 3600
    label_horizon_seconds: 3600
    label_backtrace_seconds: 3600
    max_index_rows: 500
    mcelog_max_rows: 800000
    index_features_path: data/index_stubs/features_index_h3600s_step1800s_smoke.csv
    # 切分/归一化/空窗丢弃继承 configs/data.yaml（time_stratified、robust、drop_empty_mcelog_windows）
    # 全量对比：bash scripts/build_horizon_indexes.sh full 后改为 data/raw/features_index_h3600s_step1800s_full.csv
  train:
    epochs: 20
    patience: 6
    # 冒烟对比实验：关闭 DDP/auto_batch 加速；全量生产可删此段以继承 base.yaml 默认
    gpu:
      auto_batch_size: false
    ddp:
      enabled: false
  infer:
    gpu:
      auto_batch_size: false
    ddp:
      enabled: false
