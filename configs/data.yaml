# 天池 DRAM 故障预测：索引表 + mcelog 时间窗口 + 空间热图 2D-CNN
mcelog_path: data/raw/mcelog.csv
tickets_path: data/raw/trouble_tickets.csv
inventory_path: data/raw/inventory.csv

# ---------------------------------------------------------------------------
# 预测目标（默认：未来 5 分钟内是否发生工单级故障）
# ---------------------------------------------------------------------------
# 特征窗口 [predict_time - window_seconds, predict_time)：默认与预测步长一致（5 分钟）。
window_seconds: 300
# 标签窗口 [predict_time, predict_time + label_horizon_seconds]（闭区间）。
# 时间轴：preprocess/build_index 将全局最早 raw 时间平移为 t=0（相对秒）；manifest 记录 time_epoch_offset_absolute。
# 字段别名 label_backtrace_seconds；二者同时存在时以 label_horizon_seconds 为准。
label_horizon_seconds: 300
label_backtrace_seconds: 300
label_failure_types: [1, 2, 3]

# ---------------------------------------------------------------------------
# 索引表 index_features_path
# ---------------------------------------------------------------------------
# 默认演示表由 bash scripts/build_index.sh smoke 生成（写入 features_5m_index_demo.csv）。
# 全量 / 不同预测窗：scripts/build_index.py --mode full --label-horizon-seconds 1800 --window-seconds 1800 ...
# 生成后在本文件或实验 yaml 的 overrides.data.index_features_path 指向对应 CSV，
# 并删除 data/processed、data/splits 后重跑 preprocess。
index_features_path: data/index_stubs/features_5m_index_demo.csv

# ---------------------------------------------------------------------------
# 索引生成参数（仅 scripts/build_index.py 读取；preprocess/materialize 不读此段）
# horizon / window 以本文件顶层 data.window_seconds、label_horizon_seconds 为准（勿在此重复）
# ---------------------------------------------------------------------------
index_build:
  sample_interval_seconds: 300
  positive_prefault_seconds: 3600
  target_positive_ratio: 0.25
  neg_stride_multiplier: 1
  neg_sample_strategy: uniform
  max_neg_grid_points_per_sid: 128
  min_neg_per_ticket_sid: 1
  seed: 42

index_build_presets:
  # smoke 的 mcelog_scan_rows 须与冒烟实验 overrides.data.mcelog_max_rows 一致（默认 800000）
  smoke:
    mcelog_scan_rows: 800000
    smoke_max_sids: 80
    max_rows: 500
    max_positive_candidates: 120
    neg_sample_strategy: random
    min_positives: 1
    min_total_rows: 10
  full:
    mcelog_scan_rows: null
    smoke_max_sids: null
    max_rows: null
    neg_sample_strategy: uniform
    min_neg_per_ticket_sid: 2
    max_neg_grid_points_per_sid: 256

processed_dir: data/processed
splits_dir: data/splits

# --- 网格表示（天池 132973：128×32 分箱 + bank 通道 + inventory 平铺）---
grid_representation: spatial_heatmap
row_bin_size: 1024
col_bin_size: 32
num_bank_channels: 16
inventory_as_grid_channels: true
mcelog_error_type_filter: [1, 2]

# legacy 模式下的 row/col 裁剪上限（spatial 模式下忽略）
grid_max_row: 4095
grid_max_col: 4095

preprocess_workers: null
# null 时 worker 预算 = floor(os.cpu_count() × preprocess_parallel_frac)；112 核 × 0.6 ≈ 67
# 全量实验 exp_full_best_ddp 覆盖为 0.85；共享集群可降至 0.3 或设 preprocess_workers: 1
preprocess_parallel_frac: 0.6

# mcelog 流式读分块行数；大内存服务器可增至 1000000（见 exp_full_best_ddp）
mcelog_chunk_rows: 1000000
max_index_rows: null
mcelog_max_rows: null

split_strategy: time
time_split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
