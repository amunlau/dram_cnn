# 冒烟 / 小样本实验用轻量 GridCNN（参数量约为 model.yaml 的 1/7）
arch: grid_cnn
in_channels: 31
grid_height: 128
grid_width: 32
num_classes: 2

tabular_dim: 0
tabular_fuse_dim: 32

stem_channels: 32
backbone_channels: [32, 64, 128, 128]
blocks_per_stage: 1
conv_kernel_size: 3
use_batch_norm: true
head_hidden: 128
dropout: 0.3
