batch_size: 256
# 最大训练轮次；可被 early stopping 提前终止。
epochs: 300
lr: 0.001
weight_decay: 0.0001
# DataLoader worker：0=主进程加载；全量实验见 exp_full_f1_ddp / exp_full_recall_ddp（num_workers=2）
num_workers: 0
prefetch_factor: 4
# 对总梯度 L2 范数裁剪；极不平衡 + 高 class weight 时建议开启（常见 1.0）。
max_grad_norm: 1.0
# GPU 训练时是否启用 cuDNN autotune（吞吐更好；与「跨设备比特级完全一致」不可兼得）。
cudnn_benchmark: true
# 验证指标连续 `patience` 轮无提升则早停（默认 50；冒烟实验 yaml 可覆盖为更小值）。
patience: 50
# 项目主评价指标为 F1：早停与 checkpoint 选取验证集阈值搜索后的 best_f1（与 threshold_search / infer 一致）。
# 可选 avg_precision（阈值无关排序）、roc_auc、f1_at_0p5；详见 docs/project_configuration_reference.md §7.2。
early_stop_metric: best_f1

imbalance:
  # class weight=[1, w_pos] 传入 classification_loss（加权 CE / 可选 Focal）
  use_class_weight: true
  # sqrt: w_pos = min(sqrt(neg/pos), cap)；GridCNN-Deep 默认推荐（各实验 yaml 已一致）。
  # inverse_freq: w_pos = min(neg/pos, cap)；更激进，不得与过高 oversample 叠加。
  weight_scheme: sqrt
  positive_weight_cap: 30.0
  # 0 / null = 普通加权 CE。GridCNN-Deep 在默认 lr 下 focal_gamma>0 易 NaN，生产实验保持 0。
  focal_gamma: 0.0
  # 训练集内每个正样本在索引序列中出现次数（≥1）。exp_baseline 覆盖为 1；全量默认 2。
  positive_oversample_factor: 2
  # 单机训练时可选：WeightedRandomSampler；DDP 下忽略（见 trainer 日志）。与过采样叠加时一般可保持 false。
  use_weighted_sampler: false
  sampler_positive_boost: 1.0

threshold_search:
  enabled: true
  # objective: f1 | f_beta | recall_first | min_recall（工程「宁报勿漏」用 min_recall）
  objective: f1
  min: 0.1
  max: 0.9
  step: 0.02
  # min_recall / recall_first / f_beta 专用（见 threshold_profiles 与 exp_full_recall_*）
  min_precision: 0.0
  min_recall: 0.0
  f_beta: 2.0

# gpu / ddp 默认见 configs/base.yaml；实验 overrides.train.gpu / overrides.train.ddp 可覆盖
